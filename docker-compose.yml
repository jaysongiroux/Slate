# Local stack: Postgres (pgvector), optional core-backend image, optional MinIO.
# Postgres is published on host port 5435.
#
# Linux note: core-backend uses host.docker.internal to reach Postgres on the host.
# On Linux Docker Engine, add under the core-backend service:
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
# Or point DATABASE_URL at the compose service name `postgres` instead
# (postgresql://slate:slate@postgres:5432/slate?schema=public) when both run in compose.
#
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: slate
      POSTGRES_USER: slate
      POSTGRES_PASSWORD: slate
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  core-backend:
    build:
      context: .
      dockerfile: apps/core-backend/Dockerfile.dev
    depends_on:
      - postgres
    env_file:
      - ./apps/core-backend/.env
    environment:
      DATABASE_URL: postgresql://slate:slate@host.docker.internal:5435/slate?schema=public
    ports:
      - "4000:4000"
      - "50051:50051"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: slateminio
      MINIO_ROOT_PASSWORD: slateminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
