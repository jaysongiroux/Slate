name: Desktop CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: make install
      - run: make desktop-lint
      - run: make desktop-test
      - run: make desktop-build
