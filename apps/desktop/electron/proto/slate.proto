syntax = "proto3";

package slate.v1;

message Empty {}

message AuthProvider {
  string id = 1;
  string label = 2;
  string type = 3;
  bool account_creation_enabled = 4;
}

message SessionTokens {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at_unix = 3;
}

message LoginWithPasswordRequest {
  string email = 1;
  string password = 2;
  string totp_code = 3;
  string client_id = 4;
}

message RegisterWithPasswordRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  string client_id = 4;
}

message OidcStartRequest {
  string provider_id = 1;
  string redirect_uri = 2;
  string client_id = 3;
  bool is_admin = 4;
}

message OidcCompleteRequest {
  string provider_id = 1;
  string redirect_uri = 2;
  string state = 3;
  string code = 4;
  string client_id = 5;
}

message OidcStartResponse {
  string authorization_url = 1;
  string state = 2;
}

message ListAuthProvidersResponse {
  repeated AuthProvider providers = 1;
}

message SessionResponse {
  string user_id = 1;
  SessionTokens tokens = 2;
  string email = 3;
  string display_name = 4;
  bool is_admin = 5;
}

message Document {
  string id = 1;
  string title = 2;
  string path = 3;
  string markdown = 4;
  string plain_text = 5;
  int64 updated_at_unix = 6;
  int64 server_seq = 7;
  bool deleted = 8;
  bytes crdt_state = 9;
}

message Attachment {
  string id = 1;
  string document_id = 2;
  string original_name = 3;
  string mime_type = 4;
  int64 size_bytes = 5;
  string storage_key = 6;
}

message PushDocumentUpdateRequest {
  string client_id = 1;
  string document_id = 2;
  string path = 3;
  bool deleted = 4;
  bytes crdt_update = 5;
  bytes client_state_vector = 6;
  bool pinned = 7;
}

message PushDocumentUpdateResponse {
  int64 server_seq = 1;
  bytes server_delta = 2;
  string path = 3;
  bool deleted = 4;
  bool pinned = 5;
}

message PullDocumentEventsRequest {
  string client_id = 1;
  int64 since_server_seq = 2;
}

message DocumentEvent {
  string document_id = 1;
  string path = 2;
  bool deleted = 3;
  int64 server_seq = 4;
  bytes crdt_state = 5;
  bool pinned = 6;
}

message PullDocumentEventsResponse {
  repeated DocumentEvent documents = 1;
  int64 latest_server_seq = 2;
}

message GetDocumentSnapshotRequest {
  string document_id = 1;
}

message GetDocumentSnapshotResponse {
  string document_id = 1;
  string path = 2;
  bool deleted = 3;
  int64 server_seq = 4;
  bytes crdt_state = 5;
}

message RegisterAttachmentRequest {
  string document_id = 1;
  string original_name = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
}

message RefreshTokensRequest {
  string refresh_token = 1;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchResult {
  string document_id = 1;
  string title = 2;
  string snippet = 3;
  string path = 4;
  double rank = 5;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

service AuthService {
  rpc ListAuthProviders(Empty) returns (ListAuthProvidersResponse);
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (SessionResponse);
  rpc RegisterWithPassword(RegisterWithPasswordRequest) returns (SessionResponse);
  rpc GetCurrentSession(Empty) returns (SessionResponse);
  rpc RefreshTokens(RefreshTokensRequest) returns (SessionResponse);
  rpc StartOidc(OidcStartRequest) returns (OidcStartResponse);
  rpc CompleteOidc(OidcCompleteRequest) returns (SessionResponse);
}

service DocumentService {
  rpc PushDocumentUpdate(PushDocumentUpdateRequest) returns (PushDocumentUpdateResponse);
  rpc PullDocumentEvents(PullDocumentEventsRequest) returns (PullDocumentEventsResponse);
  rpc GetDocumentSnapshot(GetDocumentSnapshotRequest) returns (GetDocumentSnapshotResponse);
}

service AttachmentService {
  rpc RegisterAttachment(RegisterAttachmentRequest) returns (Attachment);
}

service SearchService {
  rpc SearchDocuments(SearchRequest) returns (SearchResponse);
}

service AiService {
  rpc GetAiConfig (GetAiConfigRequest) returns (AiConfigResponse);
  rpc UpdateAiConfig (UpdateAiConfigRequest) returns (AiConfigResponse);
  rpc CreateConversation (CreateConversationRequest) returns (ConversationResponse);
  rpc ListConversations (ListConversationsRequest) returns (ListConversationsResponse);
  rpc DeleteConversation (DeleteConversationRequest) returns (Empty);
  rpc GetConversationMessages (GetConversationMessagesRequest) returns (GetConversationMessagesResponse);
  rpc SendMessage (SendMessageRequest) returns (stream SendMessageResponse);
  rpc TriggerEmbedding (TriggerEmbeddingRequest) returns (TriggerEmbeddingResponse);
}

message GetAiConfigRequest {}
message UpdateAiConfigRequest {
  optional string embedding_provider = 1;
  optional string embedding_model = 2;
  optional string embedding_endpoint = 3;
  optional string embedding_api_key = 4;
  optional string chat_provider = 5;
  optional string chat_model = 6;
  optional string chat_endpoint = 7;
  optional string chat_api_key = 8;
}
message AiConfigResponse {
  optional string embedding_provider = 1;
  optional string embedding_model = 2;
  optional string embedding_endpoint = 3;
  bool has_embedding_api_key = 4;
  optional string chat_provider = 5;
  optional string chat_model = 6;
  optional string chat_endpoint = 7;
  bool has_chat_api_key = 8;
  // True on UpdateAiConfig when chat provider/model/endpoint/key changed (client should end active streams).
  bool chat_streaming_config_changed = 9;
}
message CreateConversationRequest {}
message ConversationResponse {
  string id = 1;
  optional string title = 2;
  int32 message_count = 3;
  string created_at = 4;
  string updated_at = 5;
}
message ListConversationsRequest {}
message ListConversationsResponse {
  repeated ConversationResponse conversations = 1;
}
message DeleteConversationRequest {
  string id = 1;
}
message GetConversationMessagesRequest {
  string conversation_id = 1;
}
message GetConversationMessagesResponse {
  repeated ChatMessage messages = 1;
}
message ChatMessage {
  string id = 1;
  string role = 2;
  string content = 3;
  string created_at = 4;
}
message SendMessageRequest {
  string conversation_id = 1;
  string content = 2;
  repeated string enabled_calendar_ids = 3;
  repeated string enabled_ics_ids = 4;
  string timezone = 5;
}
message SendMessageResponse {
  string type = 1;
  optional string content = 2;
  optional string tool_name = 3;
  optional string document_id = 4;
  optional string title = 5;
  optional string path = 6;
  optional string error = 7;
}
message TriggerEmbeddingRequest {}
message TriggerEmbeddingResponse {
  int32 documents_queued = 1;
}

// ─── Calendar ───

message CalendarStatusRequest {}
message CalendarStatusResponse {
  repeated CalendarProviderInfo providers = 1;
  repeated CalendarConnectionInfo connections = 2;
  repeated IcsSubscriptionInfo ics_subscriptions = 3;
}

message CalendarProviderInfo {
  string provider_id = 1;
  string label = 2;
  bool configured = 3;
}

message CalendarConnectionInfo {
  string id = 1;
  string provider = 2;
  string email = 3;
  repeated CalendarInfo calendars = 4;
}

message CalendarInfo {
  string subscription_id = 1;
  string calendar_id = 2;
  string name = 3;
  string color = 4;
  bool enabled = 5;
}

message IcsSubscriptionInfo {
  string id = 1;
  string url = 2;
  string name = 3;
  string color = 4;
  bool enabled = 5;
}

message StartCalendarOAuthRequest {
  string provider_id = 1;
  string redirect_uri = 2;
}
message StartCalendarOAuthResponse {
  string authorization_url = 1;
  string state = 2;
}

message CompleteCalendarOAuthRequest {
  string provider_id = 1;
  string code = 2;
  string state = 3;
  string redirect_uri = 4;
}
message CompleteCalendarOAuthResponse {
  CalendarConnectionInfo connection = 1;
}

message DisconnectCalendarRequest {
  string connection_id = 1;
}

message ListGoogleCalendarsRequest {
  string connection_id = 1;
}
message ListGoogleCalendarsResponse {
  repeated AvailableCalendar calendars = 1;
}
message AvailableCalendar {
  string calendar_id = 1;
  string name = 2;
  string color = 3;
  bool is_primary = 4;
}

message SubscribeCalendarRequest {
  string connection_id = 1;
  string calendar_id = 2;
  string name = 3;
  string color = 4;
}
message SubscribeCalendarResponse {
  CalendarInfo subscription = 1;
}

message UnsubscribeCalendarRequest {
  string subscription_id = 1;
}

message UpdateCalendarSubscriptionRequest {
  string subscription_id = 1;
  optional string color = 2;
  optional bool enabled = 3;
}
message UpdateCalendarSubscriptionResponse {
  CalendarInfo subscription = 1;
}

message AddIcsSubscriptionRequest {
  string url = 1;
  string name = 2;
  optional string color = 3;
}
message AddIcsSubscriptionResponse {
  IcsSubscriptionInfo subscription = 1;
}

message RemoveIcsSubscriptionRequest {
  string id = 1;
}

message UpdateIcsSubscriptionRequest {
  string id = 1;
  optional string name = 2;
  optional string color = 3;
  optional bool enabled = 4;
}
message UpdateIcsSubscriptionResponse {
  IcsSubscriptionInfo subscription = 1;
}

message FetchCalendarEventsRequest {
  string time_min = 1;
  string time_max = 2;
}
message FetchCalendarEventsResponse {
  repeated CalendarEvent events = 1;
}
message CalendarEvent {
  string id = 1;
  string calendar_id = 2;
  string source = 3;
  string title = 4;
  optional string description = 5;
  optional string location = 6;
  string start_time = 7;
  string end_time = 8;
  bool all_day = 9;
  string color = 10;
  optional string html_link = 11;
  bool read_only = 12;
  optional string calendar_name = 13;
  optional string subscription_id = 14;
  optional string conference_link = 15;
  optional string conference_name = 16;
  repeated CalendarEventAttendee attendees = 17;
}

message CalendarEventAttendee {
  string email = 1;
  optional string display_name = 2;
  optional string response_status = 3;
  bool self = 4;
}

message CreateCalendarEventRequest {
  string subscription_id = 1;
  string title = 2;
  optional string description = 3;
  optional string location = 4;
  string start_time = 5;
  string end_time = 6;
  bool all_day = 7;
}
message CreateCalendarEventResponse {
  CalendarEvent event = 1;
}

message UpdateCalendarEventRequest {
  string subscription_id = 1;
  string event_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional string location = 5;
  optional string start_time = 6;
  optional string end_time = 7;
  optional bool all_day = 8;
}
message UpdateCalendarEventResponse {
  CalendarEvent event = 1;
}

message DeleteCalendarEventRequest {
  string subscription_id = 1;
  string event_id = 2;
}

message RsvpCalendarEventRequest {
  string subscription_id = 1;
  string event_id = 2;
  string response = 3;
}

service CalendarService {
  rpc GetCalendarStatus (CalendarStatusRequest) returns (CalendarStatusResponse);
  rpc StartCalendarOAuth (StartCalendarOAuthRequest) returns (StartCalendarOAuthResponse);
  rpc CompleteCalendarOAuth (CompleteCalendarOAuthRequest) returns (CompleteCalendarOAuthResponse);
  rpc DisconnectCalendar (DisconnectCalendarRequest) returns (Empty);
  rpc ListGoogleCalendars (ListGoogleCalendarsRequest) returns (ListGoogleCalendarsResponse);
  rpc SubscribeCalendar (SubscribeCalendarRequest) returns (SubscribeCalendarResponse);
  rpc UnsubscribeCalendar (UnsubscribeCalendarRequest) returns (Empty);
  rpc UpdateCalendarSubscription (UpdateCalendarSubscriptionRequest) returns (UpdateCalendarSubscriptionResponse);
  rpc AddIcsSubscription (AddIcsSubscriptionRequest) returns (AddIcsSubscriptionResponse);
  rpc RemoveIcsSubscription (RemoveIcsSubscriptionRequest) returns (Empty);
  rpc UpdateIcsSubscription (UpdateIcsSubscriptionRequest) returns (UpdateIcsSubscriptionResponse);
  rpc FetchCalendarEvents (FetchCalendarEventsRequest) returns (FetchCalendarEventsResponse);
  rpc CreateCalendarEvent (CreateCalendarEventRequest) returns (CreateCalendarEventResponse);
  rpc UpdateCalendarEvent (UpdateCalendarEventRequest) returns (UpdateCalendarEventResponse);
  rpc DeleteCalendarEvent (DeleteCalendarEventRequest) returns (Empty);
  rpc RsvpCalendarEvent (RsvpCalendarEventRequest) returns (Empty);
}
