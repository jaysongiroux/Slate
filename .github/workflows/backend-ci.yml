name: Backend CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: slate
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slate -d slate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://slate:slate@localhost:5432/slate?schema=public
      JWT_SECRET: ci-secret
      UPLOAD_ROOT: ./uploads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: make install
      - run: make backend-prisma-generate
      - run: make backend-db-migrate
      - run: make backend-test
