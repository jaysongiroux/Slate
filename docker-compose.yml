services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: slate
      POSTGRES_USER: slate
      POSTGRES_PASSWORD: slate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      - postgres
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql://slate:slate@postgres:5432/slate?schema=public
    ports:
      - "4000:4000"
      - "50051:50051"

volumes:
  postgres-data:
